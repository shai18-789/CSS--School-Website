<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math for Kids</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Floating decorative shapes -->
<div class="bg-shapes" aria-hidden="true">
  <span class="shape s1">⭐</span>
  <span class="shape s2">🎈</span>
  <span class="shape s3">✨</span>
  <span class="shape s4">🌈</span>
  <span class="shape s5">🎉</span>
  <span class="shape s6">⭐</span>
</div>

<!-- Intro Screen -->
<div id="intro-screen" class="screen active">
  <div class="mascot">🦉</div>
  <h1>Math for Kids</h1>
  <p>Practice addition, subtraction, multiplication and division with colorful, playful challenges!</p>
  <div>
    <button id="btn-play-now">🧮 Play Now</button>
  </div>
</div>

<!-- Game Screen -->
<div id="game-screen" class="screen">
  <!-- Header -->
  <header>
    <div>
      <h2><span style="background:#ff6b6b; padding:4px; border-radius:8px; font-size:0.8em;">🧮</span> Math for Kids</h2>
      <p>Let's practice and have fun!</p>
    </div>
    <button id="btn-mute">🔊</button>
  </header>

  <!-- Settings Card -->
  <div class="card settings-card">
    <!-- Operations Section (Mo-float sa wala kun Desktop) -->
    <div class="setting-group op-sidebar-group">
      <label>⚙️ Pick an operation</label>
      <div class="btn-row op-group">
        <button class="op-btn active" data-op="+">+</button>
        <button class="op-btn" data-op="-">-</button>
        <button class="op-btn" data-op="*">×</button>
        <button class="op-btn" data-op="/">÷</button>
        <button class="op-btn" data-op="random">🎲 Random</button>
      </div>
    </div>
    
    <div class="setting-group">
      <label>📊 Difficulty</label>
      <div class="pill-row">
        <button class="pill-btn active" data-diff="easy">Easy (0-5)</button>
        <button class="pill-btn" data-diff="medium">Medium (0-7)</button>
        <button class="pill-btn" data-diff="hard">Hard (0-10)</button>
      </div>
    </div>

    <div class="setting-group">
      <label>🎯 Answer mode</label>
      <div class="split-row">
        <button class="split-btn active" data-mode="type">⌨️ Type it</button>
        <button class="split-btn" data-mode="choice">🔍 Multiple Choice</button>
      </div>
    </div>

    <div class="setting-group">
      <label>⏱️ Timer mode</label>
      <div class="split-row">
        <button class="split-btn active" data-timer="off">Off</button>
        <button class="split-btn" data-timer="10s">10s Countdown</button>
      </div>
    </div>
  </div>

  <!-- Stats Card -->
  <div class="card stats-card">
    <div class="stat"><span id="stat-correct" class="correct-color">0</span><label>CORRECT</label></div>
    <div class="stat"><span id="stat-tries" class="tries-color">0</span><label>TRIES</label></div>
    <div class="stat"><span id="stat-streak" class="streak-color">0</span><label>STREAK</label></div>
    <div class="stat"><span id="stat-stars" class="stars-color">0</span><label>STARS</label></div>
  </div>

  <!-- Game Card -->
  <div class="card game-card" style="position: relative;">
    
    <!-- POP-UP MODAL -->
    <div id="popup-modal" style="display: none; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 100; text-align: center; min-width: 250px; transition: 0.3s;">
      <h2 id="popup-msg" style="margin: 0; font-size: 1.5em; line-height: 1.4;"></h2>
    </div>

    <!-- CONFETTI LAYER -->
    <div id="confetti-layer"></div>

    <!-- TIMER DISPLAY -->
    <div id="timer-display" style="display: none; font-size: 1.8em; color: #ff5252; font-weight: bold; text-align: center; margin-bottom: 15px; background: #ffebee; border-radius: 10px; padding: 5px; border: 2px solid #ff5252;">⏳ 10s</div>

    <div class="problem-display">
      <span id="display-n1">6</span>
      <span id="display-op" class="op-badge" style="background: var(--op-add);">+</span>
      <span id="display-n2">5</span>
      <span>=</span>
      <span id="question-mark">?</span>
    </div>
    
    <div id="input-container">
      <input type="number" id="answer-input" placeholder="Type your answer...">
      <div id="choice-area" class="hidden"></div>
    </div>

    <div class="action-buttons">
      <button class="action-btn" id="btn-generate">🎮 Generate</button>
      <button class="action-btn" id="btn-check">✔️ Check</button>
      <button class="action-btn" id="btn-reset">↻</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
